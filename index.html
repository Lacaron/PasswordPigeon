<!doctype html>
<html lang="fr">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Générateur de mot de passe</title>
	<link rel="manifest" href="manifest.json">
	<meta name="theme-color" content="#1a73e8">
	<link rel="stylesheet" href="styles.css">

</head>

<body>
	<div class="app">
	
		<img src="logo.svg" alt="Logo de l'entreprise" class="logo" />
	
		<h1>Générateur de mot de passe</h1>

		<div class="panel">
			<div class="label">Mot de passe</div>
			<div class="pwd-box">
				<div id="out" class="pwd hiddentext">...</div>
				<button id="cacherpwd" type="button">Révéler</button>
			</div>
			<div class="actions">
				<button id="gen">Générer un nouveau mot de passe</button>
				<button id="copy" type="button">Copier</button>
				<span id="status" class="status"></span>
			</div>
			<div class="toggle-row" style="gap: 1rem; margin-top: 0.75rem;">
				<div><strong>Longueur :</strong> <span id="len">0</span></div>
				<div><strong>Entropie :</strong> <span id="entropy">0</span> bits</div>
			</div>
		</div>

		<div class="panel">
			<div class="group">
				<div class="label">Dictionnaire</div>
				<div class="toggle-row" role="radiogroup" aria-label="Dictionnaire">
					<input type="radio" name="lang" id="lang-fr" value="fr" checked>
					<label class="pill" for="lang-fr">Français</label>

					<input type="radio" name="lang" id="lang-en" value="en">
					<label class="pill" for="lang-en">English</label>
				</div>
			</div>

			<div class="group">
				<div class="label">Nombre de mots</div>
				<div class="toggle-row" role="radiogroup" aria-label="Nombre de mots">
					<input type="radio" name="count" id="c2" value="2">
					<label class="pill" for="c2">2</label>

					<input type="radio" name="count" id="c3" value="3" checked>
					<label class="pill" for="c3">3</label>

					<input type="radio" name="count" id="c4" value="4">
					<label class="pill" for="c4">4</label>

					<input type="radio" name="count" id="c5" value="5">
					<label class="pill" for="c5">5</label>

					<input type="radio" name="count" id="c6" value="6">
					<label class="pill" for="c6">6</label>
				</div>
			</div>

			<div class="group">
				<div class="label">Séparateur</div>
				<div class="toggle-row" role="radiogroup" aria-label="Séparateur">
					<input type="radio" name="sep" id="s-space" value=" " checked>
					<label class="pill" for="s-space">Espace</label>

					<input type="radio" name="sep" id="s-" value="-">
					<label class="pill" for="s-">-</label>

					<input type="radio" name="sep" id="s_" value="_">
					<label class="pill" for="s_">_</label>

					<input type="radio" name="sep" id="splus" value="+">
					<label class="pill" for="splus">+</label>

					<input type="radio" name="sep" id="seq" value="=">
					<label class="pill" for="seq">=</label>

					<input type="radio" name="sep" id="scomma" value=",">
					<label class="pill" for="scomma">,</label>

					<input type="radio" name="sep" id="sdot" value=".">
					<label class="pill" for="sdot">.</label>
				</div>
			</div>

			<div class="group">
				<div class="label">Options</div>
				<div class="toggle-row" aria-label="Options">
					<input type="checkbox" id="caps" checked>
					<label class="pill" for="caps">Majuscule initiale</label>

					<input type="checkbox" id="use-digits" checked>
					<label class="pill" for="use-digits">Chiffres</label>
				</div>
				<div class="toggle-row toggle-row--split digit-pattern-row" id="digit-pattern-row" role="radiogroup" aria-label="Position des chiffres" style="display:flex; margin-top: 0.5rem;">
					<input type="radio" name="pattern" id="p-end-double" value="end-double" checked>
					<label class="pill" for="p-end-double">Mot·Mot·Mot·##</label>

					<input type="radio" name="pattern" id="p-per-word" value="per-word">
					<label class="pill" for="p-per-word">Mot#·Mot#·Mot#</label>
				</div>
			</div>

		</div>
		<details class="panel advanced-panel">
			<summary>Avancé</summary>
			<div class="advanced-content">
				<button id="copy-url-locked" type="button">Copier l'URL (verrouillée)</button>
				<button id="copy-url-free" type="button" class="secondary">Copier l'URL (libre)</button>
				<span id="url-copy-status" class="status"></span>
			</div>
			<div class="advanced-content" style="margin-top: 0.5rem;">
				<button id="remove-lock" type="button" class="secondary" disabled>Retirer le verrou</button>
			</div>
		</details>

		<a href="https://github.com/Lacaron/PasswordPigeon" target="_blank" rel="noopener" class="github-link">
			Voir ce projet sur GitHub
		</a>


	</div>
	<script src="js/ui.js" type="module"></script>
	<script>
		if ('serviceWorker' in navigator) {
			navigator.serviceWorker.register('./sw.js');
		}
	</script>
</body>


</html>
